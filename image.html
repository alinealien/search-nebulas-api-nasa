<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Nebulosa</title>
    <link rel="stylesheet" href="src/css/style-image.css">
</head>
<body>
    <header>
        <div class="navbar">
            <h1>Detalhes da Imagem</h1>
        </div>
    </header>

    <main>
        <!-- Contêiner para exibir a imagem selecionada e informações lado a lado -->
        <div id="image-container" class="image-container">
            <img id="selected-image" alt="Imagem Nebulosa">
            <div id="image-info" class="image-info"></div> <!-- Adicione uma classe para o estilo -->
        </div>
    
        <!-- Mais imagens para explorar -->
        <h2>Mais para explorar</h2>
        <div id="explore-more" class="grid-container"></div>
    </main>
    

    <script src="src/javascript/image-details.js"></script>

</html>
